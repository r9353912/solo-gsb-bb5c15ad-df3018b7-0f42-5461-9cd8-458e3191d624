services:
  telemetry-api:
    build: .
    image: device-telemetry-api:latest
    container_name: telemetry-api
    ports:
      - "8000:8000"
    environment:
      TELEMETRY_DB_PATH: /data/telemetry.db
      TELEMETRY_WINDOW_SIZE: "1000"
      TELEMETRY_GAP_TIMEOUT_SECONDS: "30"
      TELEMETRY_SWEEP_INTERVAL_SECONDS: "5"
      TELEMETRY_SWEEP_ENABLED: "true"
      # HMAC key for signing pagination cursors. Override with a strong
      # random value in production, e.g. in a compose override file or
      # the shell: TELEMETRY_CURSOR_SECRET=... docker compose up
      TELEMETRY_CURSOR_SECRET: ${TELEMETRY_CURSOR_SECRET:-telemetry-cursor-dev-secret}
    volumes:
      - telemetry-data:/data
    restart: unless-stopped

volumes:
  telemetry-data:
